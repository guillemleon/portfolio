<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Icons</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #0A0C0B;
      font: 11px Inter, system-ui, sans-serif;
    }

    .g {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 1px;
      background: rgba(233, 239, 235, .13);
      border: 1px solid rgba(233, 239, 235, .13);
    }

    .c {
      background: #0A0C0B;
      padding: 22px 10px 15px;
      display: grid;
      justify-items: center;
      gap: 13px;
      color: #3FE0A0;
    }

    .c span {
      color: #7C8480;
      letter-spacing: .05em;
    }
  </style>
</head>

<body>
  <h1>Icons</h1>
  <p>24px grid · 1.5 stroke · currentColor — inline them, or mask them, to take the accent.</p>
  <div class="g">
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h15"></path>
        <path d="M13 6l6 6-6 6"></path>
      </svg><span>arrow-right</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12H5"></path>
        <path d="M11 6l-6 6 6 6"></path>
      </svg><span>arrow-left</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17L17 7"></path>
        <path d="M8 7h9v9"></path>
      </svg><span>arrow-up-right</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v15"></path>
        <path d="M6 13l6 6 6-6"></path>
      </svg><span>arrow-down</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"></path>
      </svg><span>chevron-down</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h16"></path>
        <path d="M4 15h16"></path>
      </svg><span>menu</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12"></path>
        <path d="M18 6L6 18"></path>
      </svg><span>close</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3.5 7l8.5 6 8.5-6"></path>
      </svg><span>mail</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M6.5 3.5h3l1.5 4-2 1.5a10.5 10.5 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5z">
        </path>
      </svg><span>phone</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"></path>
        <path d="M7 10l5 5 5-5"></path>
        <path d="M4 20h16"></path>
      </svg><span>download</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 4h6v6"></path>
        <path d="M20 4L11 13"></path>
        <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"></path>
      </svg><span>external</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M9 19c-4 1.2-4-2.2-5.5-2.8M15 21v-3.3a2.9 2.9 0 0 0-.8-2.2c2.7-.3 4.5-1.4 4.5-5a3.9 3.9 0 0 0-1-2.7 3.6 3.6 0 0 0-.1-2.7s-1.2-.3-3.8 1.4a9.3 9.3 0 0 0-4.8 0C6.4 2.8 5.2 3.1 5.2 3.1a3.6 3.6 0 0 0-.1 2.7 3.9 3.9 0 0 0-1 2.8c0 3.5 1.8 4.6 4.5 5a2.9 2.9 0 0 0-.8 2.2V21">
        </path>
      </svg><span>github</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <path d="M7.5 10.5V17" />
        <circle cx="7.5" cy="7.4" r="0.9" fill="currentColor" stroke="none" />
        <path d="M11.6 17v-6.5" />
        <path d="M11.6 13.6a2.3 2.3 0 0 1 4.6 0V17" />
      </svg><span>linkedin</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"></circle>
      </svg><span>dot</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" stroke-opacity="0.35"></circle>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
      </svg><span>ring-cursor</span></div>
    <div class="c"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V5h4"></path>
        <path d="M20 15v4h-4"></path>
      </svg><span>viewfinder</span></div>
  </div>
</body>

</html>
